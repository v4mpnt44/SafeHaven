<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {

        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background-color: rgba(122, 117, 130, 0.3);
            border-radius: 10px;
        }
        
        .chip-active {
            background-color: #4f378a; /* primary */
            color: #ffffff; /* on-primary */
            border-color: #4f378a;
        }
        .chip-inactive {
            background-color: #f2ecf4; /* surface-container */
            color: #494551; /* on-surface-variant */
            border-color: #cbc4d2; /* outline-variant */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container pb-[100px]">
<!-- TopAppBar (From JSON, overrides prompt header for brand consistency but keeps back action) -->
<header class="fixed top-0 w-full z-50 backdrop-blur-md bg-surface-container-low/80 dark:bg-surface-container-high/80 border-b border-outline-variant/30 shadow-sm flex items-center justify-between px-gutter h-16">
<button aria-label="Go back" class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:bg-surface-container-highest transition-colors active:scale-95 duration-150 p-2 rounded-full flex-shrink-0">
            arrow_back
        </button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-primary-fixed-dim truncate px-4 text-center w-full">
            SafeHaven
        </h1>
<button aria-label="Notifications" class="material-symbols-outlined text-primary dark:text-primary-fixed-dim hover:bg-surface-container-highest transition-colors active:scale-95 duration-150 p-2 rounded-full flex-shrink-0">
            notifications
        </button>
</header>
<!-- Main Content Canvas -->
<main class="pt-[88px] px-gutter max-w-md mx-auto md:max-w-2xl">
<!-- Page Title & Icon -->
<div class="flex items-center gap-4 mb-stack-lg animate-fade-in-up">
<div class="w-14 h-14 bg-tertiary-container text-on-tertiary-container rounded-xl flex items-center justify-center shadow-sm flex-shrink-0">
<span class="material-symbols-outlined" style="font-size: 32px; font-variation-settings: 'FILL' 1;">
                    construction
                </span>
</div>
<div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Reportar Peligro Vial</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Ayuda a mantener las calles seguras.</p>
</div>
</div>
<!-- Location Context (Map) -->
<section class="mb-stack-lg relative z-0">
<div class="flex justify-between items-end mb-3">
<h3 class="font-headline-md text-headline-md-mobile text-on-surface">Ubicación Actual</h3>
<span class="font-label-caps text-label-caps text-primary cursor-pointer hover:underline">EDITAR</span>
</div>
<!-- Map Container -->
<div class="w-full h-[180px] rounded-xl overflow-hidden border border-outline-variant shadow-sm relative group bg-surface-container-lowest">
<!-- Using data-location for map generation placeholder -->
<div class="w-full h-full bg-cover bg-center transition-transform duration-700 group-hover:scale-105" data-alt="A detailed map view of an urban city street, styled in a minimalist, modern aesthetic with soft muted colors, primarily light grays, subtle purples, and whites, matching the SafeHaven app light mode theme. The map shows clean lines for roads and subtle isometric 3D building blocks in the background to indicate a residential neighborhood setting." data-location="Urban City Street" style="background-image: url('https://www.gstatic.com/labs-code/stitch/stitch-placeholder-300x300.svg')"></div>
<!-- Center Pin Overlay -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="relative">
<span class="material-symbols-outlined text-error" style="font-size: 40px; font-variation-settings: 'FILL' 1; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));">
                            location_on
                        </span>
<!-- Pulsing effect -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-6 h-6 bg-error/30 rounded-full animate-ping z-[-1]"></div>
</div>
</div>
<!-- Bottom gradient overlay for readability -->
<div class="absolute bottom-0 w-full p-3 bg-gradient-to-t from-surface-container-lowest to-transparent">
<p class="font-body-md text-body-md text-on-surface font-medium shadow-sm backdrop-blur-sm bg-surface-container-lowest/80 inline-block px-3 py-1 rounded-lg border border-outline-variant/30">
                        Av. Principal 1234
                    </p>
</div>
</div>
</section>
<!-- Hazard Type Selection (Chips) -->
<section class="mb-stack-lg">
<h3 class="font-headline-md text-headline-md-mobile text-on-surface mb-3">Tipo de Incidente</h3>
<p class="font-body-md text-body-md text-on-surface-variant mb-4">Selecciona la descripción que mejor se adapte.</p>
<div class="grid grid-cols-2 gap-3" id="chip-container">
<!-- Chip 1 (Selected by default for example) -->
<button class="hazard-chip chip-active font-body-md text-body-md font-medium border rounded-xl py-3 px-4 flex flex-col items-start gap-2 transition-all active:scale-95 duration-150 shadow-sm" onclick="selectChip(this)" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">gite</span>
                    Bache Profundo
                </button>
<!-- Chip 2 -->
<button class="hazard-chip chip-inactive font-body-md text-body-md font-medium border rounded-xl py-3 px-4 flex flex-col items-start gap-2 transition-all hover:bg-surface-container-highest active:scale-95 duration-150" onclick="selectChip(this)" type="button">
<span class="material-symbols-outlined">broken_image</span>
                    Acera Rota
                </button>
<!-- Chip 3 -->
<button class="hazard-chip chip-inactive font-body-md text-body-md font-medium border rounded-xl py-3 px-4 flex flex-col items-start gap-2 transition-all hover:bg-surface-container-highest active:scale-95 duration-150 col-span-2 sm:col-span-1" onclick="selectChip(this)" type="button">
<span class="material-symbols-outlined">traffic</span>
                    Semáforo Apagado
                </button>
<!-- Additional generic option to fill the grid nicely -->
<button class="hazard-chip chip-inactive font-body-md text-body-md font-medium border rounded-xl py-3 px-4 flex flex-col items-start gap-2 transition-all hover:bg-surface-container-highest active:scale-95 duration-150 col-span-2 sm:col-span-1" onclick="selectChip(this)" type="button">
<span class="material-symbols-outlined">more_horiz</span>
                    Otro Peligro
                </button>
</div>
</section>
<!-- Optional Details -->
<section class="mb-stack-lg">
<h3 class="font-headline-md text-headline-md-mobile text-on-surface mb-3">Detalles Adicionales (Opcional)</h3>
<textarea class="w-full bg-surface-container border border-outline-variant rounded-xl p-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all resize-none h-24" placeholder="Ej: Carril derecho bloqueado..."></textarea>
</section>
</main>
<!-- Fixed Action Bottom Bar (Replaces nav because this is a transactional task screen) -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/20 pb-safe shadow-[0_-4px_12px_rgba(0,0,0,0.05)] z-50">
<div class="max-w-md mx-auto md:max-w-2xl">
<!-- Full width primary button matching the requested brand structure -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md-mobile py-4 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition-all duration-200 flex justify-center items-center gap-3">
                Notificar a la Comunidad
                <span class="text-xl">🚘</span>
</button>
</div>
</div>
<!-- Micro-interaction script for chips -->
<script>
        function selectChip(clickedElement) {
            // Get all chips
            const chips = document.querySelectorAll('.hazard-chip');
            
            // Reset all to inactive
            chips.forEach(chip => {
                chip.classList.remove('chip-active');
                chip.classList.add('chip-inactive');
                // Adjust icon fill based on state
                const icon = chip.querySelector('.material-symbols-outlined');
                if (icon) icon.style.fontVariationSettings = "'FILL' 0";
            });
            
            // Set clicked to active
            clickedElement.classList.remove('chip-inactive');
            clickedElement.classList.add('chip-active');
            
            // Fill icon of active chip
            const activeIcon = clickedElement.querySelector('.material-symbols-outlined');
            if (activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
        }
    </script>
</body></html>
