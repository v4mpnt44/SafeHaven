<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-primary-fixed-dim">SafeHaven</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<main class="pt-24 px-container-margin md:max-w-2xl md:mx-auto">
<!-- Header Section -->
<div class="flex flex-col items-center justify-center mb-stack-lg text-center">
<div class="w-20 h-20 bg-primary-container rounded-full flex items-center justify-center mb-stack-md shadow-[0_0_20px_rgba(225,212,253,0.5)]">
<span class="material-symbols-outlined text-4xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm">Reportar Luminaria Fundida</h2>
<p class="text-on-surface-variant">Ayuda a mantener nuestra comunidad iluminada y segura.</p>
</div>
<!-- Main Form Card -->
<div class="glass-card rounded-xl p-stack-lg shadow-[0_4px_24px_rgba(0,0,0,0.06)] mb-stack-lg relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-tertiary"></div>
<form action="#" class="space-y-stack-lg" method="POST">
<!-- Location Section -->
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase block mb-stack-sm">Ubicación del problema</label>
<button class="w-full flex items-center justify-center gap-2 py-4 px-4 bg-surface-container-high hover:bg-surface-container-highest transition-colors rounded-lg border border-outline-variant/50 text-primary font-bold active:scale-[0.98] duration-150" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">my_location</span>

                    </button>
<div class="mt-stack-sm relative h-32 rounded-lg overflow-hidden border border-outline-variant/30">
<img class="w-full h-full object-cover" data-alt="A clean, minimalist street map interface showing a suburban neighborhood. The map uses a light color palette with soft gray roads, pale green parks, and subtle blue water features. A distinct, tactical-style isometric pin marks a specific location on the street. The lighting suggests daytime in a modern app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkC-zsVAsdovjyhm9bxTGtQ9Xbj-H3ikBSezcQgHlWy0pq9JryqRX5_n44pIjaJbuavSY6CEOYP9jfv87MwUVfuL9d_G1nBif7hWrBMnX4IL3f5_k1ur5Oyg1H-O_fU_z0LOyjzpL63Ff85GPoKOfbZxw4b1wdsNMf64nCSGFF7hJk0uPMPUlldfkFaOjnHNvtfkfyiUgjNDzH_B3SzqujxlBzAztyi-s7vlBXdJZF6T4JGUDbrbi9">

<span class="text-sm font-semibold text-on-surface">Av. Siempre Viva 742</span>
</div>
</div>
</div>
<!-- Photo Upload Section -->
<div>
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase block mb-stack-sm">Evidencia Fotográfica</label>
<div class="border-2 border-dashed border-outline-variant rounded-lg p-stack-lg flex flex-col items-center justify-center bg-surface-container-lowest hover:bg-surface-container-high transition-colors cursor-pointer group">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-stack-md group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-3xl text-on-surface-variant group-hover:text-on-primary-container">photo_camera</span>
</div>
<p class="font-semibold text-primary">Subir foto de la falla</p>
<p class="text-sm text-on-surface-variant mt-1 text-center">Toma una foto clara del poste o luminaria afectada</p>
</div>
</div>

<label class="font-label-caps text-label-caps text-on-surface-variant uppercase block mb-stack-sm">Detalles Adicionales (Opcional)</label>
