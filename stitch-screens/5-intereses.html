<script>
        // Simple logic to add styling specifically for checked state if CSS sibling selectors aren't enough for complex inner styling
        document.querySelectorAll('.interest-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                const container = this.nextElementSibling;
                if(this.checked) {
                    container.classList.add('bg-ice-blue/20', 'border-navy');
                    container.classList.remove('border-outline-variant', 'bg-surface-container-lowest');
                } else {
                    container.classList.remove('bg-ice-blue/20', 'border-navy');
                    container.classList.add('border-outline-variant', 'bg-surface-container-lowest');
                }
            });
        });
    </script>
