<style>
        /* Custom Brutalist Inputs */
        .brutalist-input {
            width: 3.5rem;

            font-weight: 700;
            border: 3px solid #1d1b20; /* High contrast black/dark gray */
            border-radius: 0; /* Sharp corners */
            background-color: #ffffff;
            color: #1d1b20;
            transition: all 0.2s ease-in-out;
            box-shadow: 4px 4px 0px 0px #1d1b20; /* Brutalist shadow */
            outline: none;
        }

        .brutalist-input:focus {
            border-color: #014BA0; /* Primary navy accent requested by user */
            box-shadow: 4px 4px 0px 0px #014BA0;
            transform: translate(-2px, -2px);
        }
        
        /* Brutalist Button */

<body class="bg-surface-container-lowest text-on-surface h-screen w-full flex flex-col font-body-md text-body-md antialiased overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Nav Shell Suppressed for Linear/Transactional Flow -->
<!-- Top App Bar (Custom for Transactional) -->
<header class="flex items-center justify-between px-gutter h-16 w-full fixed top-0 z-50 bg-surface-container-lowest/90 backdrop-blur-md border-b-2 border-on-surface">
<button class="p-2 -ml-2 text-on-surface hover:bg-surface-variant transition-colors active:scale-95 flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 600;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-on-surface tracking-tight uppercase">SafeHaven</h1>
<!-- Spacer to balance back button -->
<div class="w-10"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col pt-24 pb-safe px-gutter max-w-md mx-auto w-full justify-between overflow-y-auto">
<div class="flex flex-col gap-stack-lg">
<!-- Header Text -->
<div class="flex flex-col gap-stack-sm mt-8 relative">
<!-- Decorative brutalist accent -->
<div class="absolute -top-6 -left-2 w-12 h-12 bg-accent-sky opacity-50 -z-10 mix-blend-multiply"></div>
<h2 class="font-headline-lg text-headline-lg-mobile text-on-surface uppercase tracking-tight leading-none mb-2">
                    Verifica tu<br/>número
                </h2>
<p class="text-on-surface-variant max-w-[280px]">
                    Hemos enviado un código de 6 dígitos a tu celular.
                </p>
</div>
<!-- Verification Input Form -->
<form class="flex flex-col gap-stack-lg mt-8" id="verification-form">
<!-- 6-Digit Inputs -->
<div class="flex justify-between w-full gap-2" id="otp-container">
<input aria-label="Digit 1" autofocus="" class="brutalist-input" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Digit 2" class="brutalist-input" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Digit 3" class="brutalist-input" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Digit 4" class="brutalist-input" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Digit 5" class="brutalist-input" maxlength="1" pattern="\d*" type="number"/>
<input aria-label="Digit 6" class="brutalist-input" maxlength="1" pattern="\d*" type="number"/>
</div>
<!-- Countdown -->
<div class="flex items-center gap-2 mt-4 text-sm font-bold text-on-surface-variant">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'wght' 700;">timer</span>
<span>Reenviar código en <span class="text-on-surface" id="timer">00:59</span></span>
</div>
</form>
</div>
<!-- Sticky Bottom Action -->
<div class="mt-auto pt-8 pb-8 flex flex-col gap-4">
<button class="w-full bg-accent-navy text-on-primary font-headline-md text-headline-md-mobile uppercase py-4 px-6 flex items-center justify-center gap-2 brutalist-button hover:opacity-90" type="button">
<span>Verificar</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 700;">arrow_forward</span>
</button>
<div class="text-center">
<button class="font-label-caps text-label-caps text-on-surface-variant hover:text-on-surface underline decoration-2 underline-offset-4 transition-colors" type="button">
                    ¿NECESITAS AYUDA?
                </button>
</div>
</div>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // OTP Input Logic
            const inputs = document.querySelectorAll('#otp-container input');
            
            inputs.forEach((input, index) => {
                // Focus styling class toggle
                input.addEventListener('focus', () => {
                    input.classList.add('border-accent-navy');
                });
                
                input.addEventListener('blur', () => {
                    input.classList.remove('border-accent-navy');
                });

                // Auto-advance logic
                input.addEventListener('input', (e) => {
                    // Ensure only 1 digit
                    if (e.target.value.length > 1) {
                        e.target.value = e.target.value.slice(0, 1);
                    }
                    
                    // Move to next input if filled
                    if (e.target.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                // Handle backspace to move to previous
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Allow paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, 6).replace(/\D/g, '');
                    if(pastedData) {
                        for(let i=0; i<pastedData.length; i++) {
                            if(inputs[i]) {
                                inputs[i].value = pastedData[i];
                                if(i < inputs.length - 1) {
                                    inputs[i+1].focus();
                                }
                            }
                        }
                    }
                });
            });

            // Timer Logic
            let timeLeft = 59;
            const timerElement = document.getElementById('timer');
            
            const countdown = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerElement.parentElement.innerHTML = '<button class="text-accent-navy font-bold underline decoration-2 underline-offset-2">Reenviar código ahora</button>';
                } else {
                    const seconds = timeLeft.toString().padStart(2, '0');
                    timerElement.textContent = `00:${seconds}`;
                    timeLeft--;
                }
            }, 1000);
        });
    </script>
