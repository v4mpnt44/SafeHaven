<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Inter:wght@400;700&amp;family=Anton&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "primary-container": "#6750a4",
                    "on-error": "#ffffff",
                    "inverse-on-surface": "#f5eff7",
                    "tertiary-container": "#c9a74d",
                    "surface-tint": "#6750a4",
                    "tertiary-fixed": "#ffdf93",
                    "surface-bright": "#fdf7ff",
                    "on-tertiary-fixed-variant": "#594400",
                    "on-secondary-fixed-variant": "#4b4263",
                    "tertiary": "#765b00",
                    "error-container": "#ffdad6",
                    "primary": "#4f378a",
                    "surface-container": "#f2ecf4",
                    "on-secondary-container": "#645a7d",
                    "outline-variant": "#cbc4d2",
                    "primary-fixed-dim": "#cfbcff",
                    "surface-container-highest": "#e6e0e9",
                    "on-secondary-fixed": "#1f1635",
                    "outline": "#7a7582",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-high": "#ece6ee",
                    "on-primary-fixed-variant": "#4f378a",
                    "on-tertiary-container": "#503d00",
                    "background": "#fdf7ff",
                    "on-tertiary-fixed": "#241a00",
                    "secondary-container": "#e1d4fd",
                    "on-primary-fixed": "#22005d",
                    "on-secondary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-surface-variant": "#494551",
                    "surface": "#fdf7ff",
                    "secondary": "#63597c",
                    "primary-fixed": "#e9ddff",
                    "surface-variant": "#e6e0e9",
                    "secondary-fixed-dim": "#cdc0e9",
                    "on-primary-container": "#e0d2ff",
                    "inverse-primary": "#cfbcff",
                    "on-background": "#1d1b20",
                    "surface-container-low": "#f8f2fa",
                    "error": "#ba1a1a",
                    "on-surface": "#1d1b20",
                    "inverse-surface": "#322f35",
                    "surface-dim": "#ded8e0",
                    "on-primary": "#ffffff",
                    "tertiary-fixed-dim": "#e7c365",
                    "secondary-fixed": "#e9ddff",
                    "on-tertiary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-sm": "4px",
                    "container-margin": "24px",
                    "unit": "8px",
                    "stack-md": "12px",
                    "gutter": "16px",
                    "stack-lg": "24px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "label-caps": ["Inter"],
                    "headline-lg": ["Hanken Grotesk"],
                    "body-md": ["Inter"],
                    "headline-md": ["Hanken Grotesk"],
                    "display-emergency": ["Anton"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "display-emergency": ["72px", {"lineHeight": "72px", "letterSpacing": "0.05em", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        .pulsing-glow {
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(103, 80, 164, 0.4); }
            50% { box-shadow: 0 0 20px 10px rgba(103, 80, 164, 0); }
        }
        .map-gradient-overlay {
            background: linear-gradient(to bottom, rgba(253, 247, 255, 0.8) 0%, rgba(253, 247, 255, 0) 20%, rgba(253, 247, 255, 0) 80%, rgba(253, 247, 255, 1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-x-hidden">
<!-- Top Navigation Anchor -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 shadow-sm flex justify-between items-center px-6 h-16">
<div class="flex items-center gap-3">
<div class="w-10 h-10 overflow-hidden" style="clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);">
<img class="w-full h-full object-cover" data-alt="A tactical-chic user portrait in a high-detail hexagonal frame, featuring a young professional against a soft purple background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCpjZ6xN7P_k3HUOyIsq4us0Je4VjUXeYwxwdeDSwrIKpLu8MLPHIqktQCNvq6lCZp_0ZYqkx7BHGk_URUTni6K86ShPcTAkbY4Y7JZRgZUL6eTGzDA1JXy0zKfDR-SJ-pUwNlV-SNyz2lK7-NJx8tFtyCEfuLP7_aBlKyvTv_rQjPKyRqO60BceA4_dbeiwhez1E_3jGHuVYo3812VFnqQSpfncLZGZRq29bnA-B3zUBWYlUYw4JhH">
</div>
<h1 class="font-display-emergency text-headline-lg-mobile tracking-tighter text-primary">SAFEHAVEN</h1>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-primary-container/20 active:scale-95 transition-all duration-200 text-primary">
<span class="material-symbols-outlined">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="pt-16 pb-24 min-h-screen relative">
<!-- Background Isometric Map -->
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" data-alt="A beautiful 3D isometric stylized map of a modern urban neighborhood with clean, minimalist buildings." data-location="Madrid City Center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDN2oySNc7rvzzv0YZAlnYgqSaM4c_WKcFflAjulfldLXqPbw-rP3NkSY4ShRtL8DIWHzb0YxNB6dVOFdVpXeaFsHPKZyHWTQZ2uRMMOABK958xLkLNUgtgfPOhVWlxW52Y4dKoo9szk50lyS7rPYISg1lRmVBU-lsGNip1bACMd_ULrNZL6d98B67Aki2zmz8kPec7hJZgc-xREshtzFmcqjk6JVvWcDrZIKIwa0niAmWvckJ4Yke8')"></div>
<div class="absolute inset-0 map-gradient-overlay pointer-events-none"></div>
</div>
<!-- Content Overlay -->
<div class="relative z-10 px-container-margin flex flex-col items-center">
<!-- Section Title (Acompañamiento IA) -->
<div class="w-full mt-4 flex items-center justify-between">
<h2 class="font-headline-md text-primary">Acompañamiento IA</h2>
</div>
<!-- Guardian Status Card -->
<div class="w-full mt-4 bg-surface/60 backdrop-blur-md rounded-xl border border-outline-variant/30 p-4 shadow-sm flex items-center gap-4">
<div class="relative flex-shrink-0">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center pulsing-glow overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A cute, chibi-style 3D isometric guardian robot holding a bright glowing yellow lantern." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmnONix7bhuYE8qXDcy9AKj2a2qs9w6zEvoqiwbxgly5E66aBThYg3JD8cDPDZZxgKPblUrYUobnsWCNNOidf3HnknU7dhaGz1BS-Oh24dWY-4EVyu6rT8rhcLof3D93XeKrI6G1csJnk45if44jcu7ZQY-cBO1IogBFnh-eZ0alr54BRcO2FD7NB8TTnXJpPCDIIeNtP6Qw-3NfsgHqaQOZzZhQSU1ejRHW2LZo3_Y7OM-rPSVp_I">
</div>
<div class="absolute -bottom-1 -right-1 w-6 h-6 bg-tertiary-container rounded-full border-2 border-surface flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-on-tertiary-container fill-icon">shield</span>
</div>
</div>
<div>
<h2 class="font-headline-md text-primary">Guardián Activo</h2>
<p class="text-on-surface-variant font-medium">Ruta Optimizada • 12 min restantes</p>
</div>
<div class="ml-auto">
<span class="inline-flex items-center gap-1 bg-primary-container/10 text-primary px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
<span class="w-2 h-2 bg-primary rounded-full animate-pulse"></span>
                        En Vivo
                    </span>
</div>
</div>
<!-- Route Details & Checkpoints (Bento Style) -->
<div class="grid grid-cols-2 gap-4 w-full mt-6">
<!-- Progress Box -->
<div class="bg-surface/80 backdrop-blur-md rounded-xl border border-outline-variant/30 p-4 flex flex-col justify-between">
<span class="text-label-caps text-on-surface-variant uppercase">Progreso</span>
<div class="mt-2 flex items-baseline gap-1">
<span class="text-3xl font-bold text-primary">75</span>
<span class="text-on-surface-variant font-bold">%</span>
</div>
<div class="w-full bg-outline-variant/30 h-2 rounded-full mt-2 overflow-hidden">
<div class="bg-primary h-full w-3/4 rounded-full"></div>
</div>
</div>
<!-- Security Status Box -->
<div class="bg-surface/80 backdrop-blur-md rounded-xl border border-outline-variant/30 p-4 flex flex-col justify-between">
<span class="text-label-caps text-on-surface-variant uppercase">Estatus</span>
<div class="flex items-center gap-2 mt-2">
<span class="material-symbols-outlined text-tertiary fill-icon">verified_user</span>
<span class="font-headline-md text-tertiary">Zona Segura</span>
</div>
<p class="text-[10px] text-on-surface-variant leading-tight">Patrullas cercanas activas en el sector.</p>
</div>
</div>
<!-- Interaction Buttons (XL) -->
<div class="w-full mt-8 flex flex-col gap-4 mb-12">
<button class="w-full bg-primary text-on-primary py-5 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-all duration-300 flex items-center justify-center gap-3">
<span class="material-symbols-outlined fill-icon">task_alt</span>
                    Llegué a Salvo
                </button>
<button class="w-full bg-surface-container-highest text-on-surface border-2 border-outline-variant py-5 rounded-xl font-bold text-lg active:scale-95 transition-all duration-300 flex items-center justify-center gap-3">
<span class="material-symbols-outlined text-error">report_problem</span>
                    Reportar Problema
                </button>
</div>
<!-- SOS Pulse (Decorative Floating Element) -->
<div class="fixed bottom-32 right-6">
<button class="w-16 h-16 bg-error text-on-error rounded-full shadow-[0_8px_20px_rgba(186,26,26,0.4)] flex items-center justify-center group active:scale-90 transition-all">
<span class="material-symbols-outlined text-3xl font-bold">sos</span>
</button>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-4 h-20 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/30 rounded-t-xl">
<!-- Map (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-6 py-2 active:scale-90 transition-all duration-300 ease-out" href="#">
<span class="material-symbols-outlined fill-icon" data-icon="map">map</span>
<span class="font-label-caps text-[10px] uppercase mt-0.5">Mapa</span>
</a>
<!-- Flock -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary active:scale-90 transition-all duration-300 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-caps text-[10px] uppercase mt-0.5">Gupo</span>
</a>
<!-- Closet -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary active:scale-90 transition-all duration-300 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="wardrobe">downloading</span>
<span class="font-label-caps text-[10px] uppercase mt-0.5">Guardado</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant p-2 hover:text-primary active:scale-90 transition-all duration-300 ease-out" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-[10px] uppercase mt-0.5">Perfil</span>
</a>
</nav>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('button, a');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (window.navigator.vibrate) {
                        window.navigator.vibrate(10);
                    }
                });
            });
        });
    </script>
</body></html>
