<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SafeHaven - Create New Group</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary-fixed": "#1f1635",

                      "background": "#fdf7ff",
                      "on-tertiary": "#ffffff",
                      "error-container": "#ffdad6",
                      "on-tertiary-container": "#503d00",
                      "on-secondary-container": "#645a7d",
                      "outline": "#7a7582",
                      "on-surface": "#1d1b20",
                      "tertiary-fixed": "#ffdf93",
                      "secondary": "#63597c",
                      "primary": "#4f378a",
                      "error": "#ba1a1a",
                      "on-primary-fixed-variant": "#4f378a",
                      "inverse-surface": "#322f35",
                      "on-primary-container": "#e0d2ff",
                      "primary-fixed": "#e9ddff",
                      "on-primary-fixed": "#22005d",
                      "surface-bright": "#fdf7ff",
                      "on-tertiary-fixed-variant": "#594400",
                      "on-secondary-fixed-variant": "#4b4263",
                      "surface-variant": "#e6e0e9",
                      "surface-container-low": "#f8f2fa",
                      "tertiary-container": "#c9a74d",
                      "on-background": "#1d1b20",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-high": "#ece6ee",
                      "secondary-fixed-dim": "#cdc0e9",
                      "on-error-container": "#93000a",
                      "inverse-primary": "#cfbcff",
                      "secondary-fixed": "#e9ddff",
                      "surface-container-highest": "#e6e0e9",
                      "outline-variant": "#cbc4d2",
                      "primary-fixed-dim": "#cfbcff",
                      "surface-tint": "#6750a4",
                      "on-primary": "#ffffff",
                      "surface-container": "#f2ecf4",
                      "primary-container": "#6750a4",
                      "tertiary": "#765b00",
                      "secondary-container": "#e1d4fd",
                      "inverse-on-surface": "#f5eff7",
                      "on-secondary": "#ffffff",
                      "surface": "#fdf7ff",
                      "on-error": "#ffffff",
                      "on-tertiary-fixed": "#241a00"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "16px",
                      "stack-lg": "24px",
                      "stack-md": "12px",
                      "unit": "8px",
                      "stack-sm": "4px",
                      "container-margin": "24px"
              },
              "fontFamily": {
                      "label-caps": [
                              "Inter"
                      ],
                      "body-md": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Hanken Grotesk"
                      ],
                      "display-emergency": [
                              "Anton"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg-mobile": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.1em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-md": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "display-emergency": [
                              "72px",
                              {
                                      "lineHeight": "72px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg-mobile": [
                              "28px",
                              {
                                      "lineHeight": "34px",
                                      "fontWeight": "700"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        .glass-card {
            background: rgba(253, 247, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col relative overflow-hidden">
<!-- Decorative Background Elements -->
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-container rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-container rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
<!-- Main Navigation (Suppressed - Transactional/Flow screen) -->
<!-- Navigation shell is excluded as per the "Destination Rule" for linear/transactional flows. -->
<!-- Header (Custom for Flow) -->
<header class="flex items-center justify-between px-container-margin py-stack-md w-full z-10 sticky top-0 bg-surface/80 backdrop-blur-md border-b border-outline-variant/30">
<button class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant transition-colors text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<div class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">
            Crear Círculo - Paso 1/3
        </div>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-container-margin py-stack-lg z-10 w-full max-w-md mx-auto">
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm md:font-headline-lg md:text-headline-lg">
                Nombra tu Círculo
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Un círculo es tu grupo seguro. Nómbralo para identificarlo fácilmente.
            </p>
</div>
<div class="glass-card rounded-xl p-stack-lg mb-stack-lg flex-grow">
<!-- Group Name Input -->
<div class="mb-stack-lg">
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-unit" for="group-name">
                    Nombre del Grupo
                </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-b-2 border-outline-variant focus:border-primary focus:ring-0 px-0 py-stack-md font-body-md text-body-md text-on-surface placeholder:text-outline-variant transition-colors outline-none bg-transparent" id="group-name" placeholder="Ej. Familia, Vecinos de Calle 4..." type="text"/>
</div>
</div>
<!-- Avatar Selection -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-stack-md">
                    Elegir un Avatar para el Grupo
                </label>
<div class="grid grid-cols-3 gap-unit md:gap-stack-md">
<!-- Avatar Option 1 (Selected) -->
<label class="cursor-pointer group relative">
<input checked="" class="peer sr-only" name="group-avatar" type="radio" value="family"/>
<div class="flex flex-col items-center justify-center p-stack-md rounded-xl border-2 border-transparent bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-container/20 hover:bg-surface-variant/50 transition-all">
<div class="w-16 h-16 rounded-lg hexagon-mask overflow-hidden mb-unit border border-outline-variant/30 flex items-center justify-center bg-secondary-container text-on-secondary-container">
<span class="material-symbols-outlined text-3xl" data-icon="family_home">family_home</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface peer-checked:text-primary transition-colors text-center w-full truncate">Familia</span>
</div>
</label>
<!-- Avatar Option 2 -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="group-avatar" type="radio" value="friends"/>
<div class="flex flex-col items-center justify-center p-stack-md rounded-xl border-2 border-transparent bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-container/20 hover:bg-surface-variant/50 transition-all">
<div class="w-16 h-16 rounded-lg hexagon-mask overflow-hidden mb-unit border border-outline-variant/30 flex items-center justify-center bg-tertiary-container text-on-tertiary-container">
<span class="material-symbols-outlined text-3xl" data-icon="group">group</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface peer-checked:text-primary transition-colors text-center w-full truncate">Amigos</span>
</div>
</label>
<!-- Avatar Option 3 -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="group-avatar" type="radio" value="neighbors"/>
<div class="flex flex-col items-center justify-center p-stack-md rounded-xl border-2 border-transparent bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-container/20 hover:bg-surface-variant/50 transition-all">
<div class="w-16 h-16 rounded-lg hexagon-mask overflow-hidden mb-unit border border-outline-variant/30 flex items-center justify-center bg-surface-tint/20 text-surface-tint">
<span class="material-symbols-outlined text-3xl" data-icon="home_work">home_work</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface peer-checked:text-primary transition-colors text-center w-full truncate">Vecinos</span>
</div>
</label>
<!-- Avatar Option 4 -->
<label class="cursor-pointer group relative">
<input class="peer sr-only" name="group-avatar" type="radio" value="work"/>
<div class="flex flex-col items-center justify-center p-stack-md rounded-xl border-2 border-transparent bg-surface-container-low peer-checked:border-primary peer-checked:bg-primary-container/20 hover:bg-surface-variant/50 transition-all">
<div class="w-16 h-16 rounded-lg hexagon-mask overflow-hidden mb-unit border border-outline-variant/30 flex items-center justify-center bg-surface-container-high text-on-surface-variant">
<span class="material-symbols-outlined text-3xl" data-icon="work">work</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface peer-checked:text-primary transition-colors text-center w-full truncate">Trabajo</span>
</div>
</label>
<!-- Avatar Option 5 (Custom/Upload placeholder) -->
<label class="cursor-pointer group relative col-span-2">
<input class="peer sr-only" name="group-avatar" type="radio" value="custom"/>
<div class="flex flex-row items-center justify-start px-stack-md py-unit rounded-xl border-2 border-dashed border-outline-variant bg-transparent peer-checked:border-primary peer-checked:bg-primary-container/10 hover:bg-surface-variant/30 transition-all h-full">
<div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center mr-unit text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="add_photo_alternate">add_photo_alternate</span>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant group-hover:text-on-surface peer-checked:text-primary transition-colors">Subir Imagen</span>
</div>
</label>
</div>
</div>
</div>
</main>
<!-- Bottom Action Area (Sticky) -->
<div class="px-container-margin py-stack-md bg-surface/90 backdrop-blur-md border-t border-outline-variant/20 sticky bottom-0 w-full z-20 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-stack-md rounded-xl hover:opacity-90 active:scale-95 transition-all shadow-md flex items-center justify-center gap-unit">
                Continuar
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Inline script for hexagonal mask style since standard tailwind doesn't have it built-in easily without complex arbitrary values -->
<style>
        .hexagon-mask {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }
    </style>
</body></html>
