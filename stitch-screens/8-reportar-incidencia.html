<!DOCTYPE html><html class="light" lang="es"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>SafeHaven - Reportar Incidencia</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400;700&amp;family=Anton&amp;display=swap" rel="stylesheet">
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#cdc0e9",
                    "error-container": "#ffdad6",
                    "on-surface": "#1d1b20",
                    "background": "#fdf7ff",
                    "on-secondary-container": "#645a7d",
                    "primary": "#4f378a",
                    "on-secondary-fixed-variant": "#4b4263",
                    "surface-dim": "#ded8e0",
                    "primary-fixed-dim": "#cfbcff",
                    "surface-variant": "#e6e0e9",
                    "surface": "#fdf7ff",
                    "tertiary": "#765b00",
                    "on-secondary-fixed": "#1f1635",
                    "tertiary-fixed-dim": "#e7c365",
                    "tertiary-fixed": "#ffdf93",
                    "on-surface-variant": "#494551",
                    "inverse-surface": "#322f35",
                    "outline-variant": "#cbc4d2",
                    "error": "#ba1a1a",
                    "tertiary-container": "#c9a74d",
                    "on-primary-fixed-variant": "#4f378a",
                    "on-tertiary": "#ffffff",
                    "secondary-container": "#e1d4fd",
                    "secondary": "#63597c",
                    "on-primary-fixed": "#22005d",
                    "secondary-fixed": "#e9ddff",
                    "on-tertiary-fixed-variant": "#594400",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "on-tertiary-container": "#503d00",
                    "surface-tint": "#6750a4",
                    "on-background": "#1d1b20",
                    "surface-container-low": "#f8f2fa",
                    "on-error": "#ffffff",
                    "inverse-primary": "#cfbcff",
                    "inverse-on-surface": "#f5eff7",
                    "surface-container-highest": "#e6e0e9",
                    "surface-container-high": "#ece6ee",
                    "surface-bright": "#fdf7ff",
                    "primary-container": "#6750a4",
                    "on-primary-container": "#e0d2ff",
                    "primary-fixed": "#e9ddff",
                    "outline": "#7a7582",
                    "surface-container": "#f2ecf4",
                    "on-primary": "#ffffff",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed": "#241a00",
                    "brand-sky": "#B2FFFF"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1.5rem",
                    "3xl": "2rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "12px",
                    "stack-lg": "24px",
                    "container-margin": "24px",
                    "stack-sm": "4px",
                    "gutter": "16px",
                    "unit": "8px"
            },
            "fontFamily": {
                    "headline-lg": ["Hanken Grotesk"],
                    "display-emergency": ["Anton"],
                    "body-md": ["Inter"],
                    "headline-md": ["Hanken Grotesk"],
                    "label-caps": ["Inter"],
                    "headline-lg-mobile": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "display-emergency": ["72px", {"lineHeight": "72px", "letterSpacing": "0.05em", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "34px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: #B2FFFF; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-hazard {
            border: 3px solid #4f378a;
            transform: scale(0.98);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="min-h-screen font-body-md text-on-surface">
<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md shadow-sm border-b border-outline-variant/30 flex items-center justify-between px-container-margin h-16">
<div class="flex items-center gap-2">
<button class="material-symbols-outlined text-primary active:scale-95 transition-transform" data-icon="arrow_back">arrow_back</button>
<span class="font-headline-md text-headline-md font-bold text-primary tracking-tight">SafeHaven</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary" data-icon="notifications">notifications</span>
</div>
</header>
<main class="pt-20 pb-32 px-container-margin space-y-gutter">
<!-- Detective Avatar Card -->
<div class="bg-surface-container-lowest rounded-3xl p-6 shadow-sm flex items-center gap-4 border border-outline-variant/20">
<div class="w-20 h-20 rounded-full overflow-hidden flex-shrink-0 bg-primary/10 border-2 border-primary-container">
<img alt="Safety Detective Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBA1HOrII9_egSLVmZFg4d-4KwNOBEoH9SmjXIM0-Bjk1epdawqIcLKWAygm3Vjqzyh-9vlCcZeO1ghBOc-8k5NjkpqvipApq2OuDZ8CyDWpVPEaGF1ldj06o5QSVs_CiMwmY7BrKSPgUYWhT1K2-tvHRzPj0Kx1YYputdOBLqpr6Usb6l8tk_vgplJEeJdLltGKD1l3uv0QaF1YX6rwAI4GfLNULtLL2WdFeTGbINH6XqDsYsKzADv">
</div>
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Reportar un Peligro</h1>
<p class="text-on-surface-variant font-body-md">Ayuda a mantener tu comunidad segura</p>
</div>
</div>
<!-- Reporting Grid -->
<div class="grid grid-cols-2 gap-4">
<button class="bg-surface rounded-2xl p-6 flex flex-col items-center justify-center gap-3 shadow-sm border border-outline-variant/30 active:scale-95 transition-all group" onclick="toggleHazard(this)">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="lightbulb">lightbulb</span>
</div>
<span class="font-label-caps text-label-caps text-center text-on-surface">Luminaria Fundida</span>
</button>
<button class="bg-surface rounded-2xl p-6 flex flex-col items-center justify-center gap-3 shadow-sm border border-outline-variant/30 active:scale-95 transition-all group" onclick="toggleHazard(this)">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="visibility">visibility</span>
</div>
<span class="font-label-caps text-label-caps text-center text-on-surface">Zona Sospechosa</span>
</button>
<button class="bg-surface rounded-2xl p-6 flex flex-col items-center justify-center gap-3 shadow-sm border border-outline-variant/30 active:scale-95 transition-all group" onclick="toggleHazard(this)">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="warning">warning</span>
</div>
<span class="font-label-caps text-label-caps text-center text-on-surface">Peligro Vial</span>
</button>
<button class="bg-surface rounded-2xl p-6 flex flex-col items-center justify-center gap-3 shadow-sm border border-outline-variant/30 active:scale-95 transition-all group" onclick="toggleHazard(this)">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="report_problem">report_problem</span>
</div>
<span class="font-label-caps text-label-caps text-center text-on-surface">Incidente</span>
</button>
</div>
<!-- Location Section -->
<div class="bg-surface rounded-2xl overflow-hidden shadow-sm border border-outline-variant/30">
<div class="p-4 flex items-center justify-between">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="location_on">location_on</span>
<div>
<p class="text-[10px] font-bold text-outline uppercase tracking-wider">UBICACIÓN ACTUAL</p>
<p class="font-body-md font-bold text-on-surface">Av. Reforma 222</p>
</div>
</div>
<button class="px-4 py-2 bg-secondary-container text-on-secondary-container rounded-full text-label-caps font-bold active:scale-95 transition-transform">Cambiar</button>
</div>
<!-- Map Snippet -->
<div class="h-32 bg-surface-container-high relative overflow-hidden">
<img class="w-full h-full object-cover opacity-60" data-alt="A clean, minimalist vector map illustration of a city street intersection at Avenida Reforma 222. The style is modern tactical-chic with soft pastel blues and whites, featuring a prominent purple map pin with a pulse effect. The design is airy and professional, reflecting a high-end community security platform aesthetic." data-location="Mexico City" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBQclvMuTOP0DnEpJV1hkd66UgX_XvKtcdcJrce6eIvLACeV0PV80f6Zd1uqumTKz0ZiZRwOm7bm5uvI2RAQaHYnro6IHs-1TLloErXYQMinRf2aSY5CQAWB9N0HSvczwW06YNUaPjRfqcxFEV88zdnCj9G6hZMnWVqSGY7A9beKfU1-Y0RKdeEWOgfp2mYQZXJG7jrVAudhIHHqfpi10MBDp1fSoAHF7OUtZCT_6N6DAQGZ2mn8dnz">
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-4 h-4 bg-primary rounded-full animate-ping opacity-75"></div>
<div class="w-3 h-3 bg-primary rounded-full absolute"></div>
</div>
</div>
</div>
<!-- Input Section -->
<div class="flex gap-4">
<button class="flex-1 flex items-center justify-center gap-2 py-4 rounded-2xl border-2 border-primary text-primary font-bold active:bg-primary/5 transition-colors">
<span class="material-symbols-outlined" data-icon="camera_alt">camera_alt</span>
<span>Tomar Foto</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 py-4 rounded-2xl border-2 border-primary text-primary font-bold active:bg-primary/5 transition-colors">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
<span>Nota de Voz</span>
</button>
</div>
</main>
<!-- Bottom Action & Navigation -->
<footer class="fixed bottom-0 w-full z-50">
<!-- Floating Primary Action -->
<div class="px-container-margin pb-4">
<button class="w-full py-5 bg-primary text-white rounded-2xl font-bold text-headline-md shadow-lg flex items-center justify-center gap-3 hover:brightness-110 active:scale-[0.98] transition-all">
<span>Enviar Reporte</span>
<span class="bg-white/20 px-3 py-1 rounded-full text-sm font-bold">(+50 Safepoints)</span>
</button>
</div>
<!-- Bottom Nav Bar -->
<nav class="bg-surface/90 backdrop-blur-xl border-t border-outline-variant/50 flex justify-around items-center h-20 px-4 pb-2">
<button class="flex flex-col items-center justify-center text-on-surface-variant gap-1 active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="map">map</span>
<span class="font-label-caps text-label-caps">Mapa</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant gap-1 active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-label-caps text-label-caps">Comunidad</span>
</button>
<!-- Reporting is active (closest to current page intent) -->
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-1 active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="wardrobe" data-weight="fill" style="font-variation-settings: 'FILL' 1;">downloading</span>
<span class="font-label-caps text-label-caps">Armario</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant gap-1 active:scale-90 transition-all">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Perfil</span>
</button>
</nav>
</footer>
<script>
        function toggleHazard(el) {
            // Remove active from all siblings
            const buttons = el.parentElement.querySelectorAll('button');
            buttons.forEach(btn => btn.classList.remove('active-hazard', 'bg-primary-container/20'));
            
            // Add active to current
            el.classList.add('active-hazard', 'bg-primary-container/20');
            
            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }
    </script>
</body></html>
