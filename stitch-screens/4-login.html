<!DOCTYPE html><html class="light" lang="es"><head>

<style>
        body {
            background-color: #B2FFFF;
            background-image: radial-gradient(circle at top right, rgba(255,255,255,0.8), transparent 70%),
                              radial-gradient(circle at bottom left, rgba(79, 55, 138, 0.1), transparent 60%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex items-center justify-center p-gutter md:p-container-margin font-body-md text-on-background">
<main class="w-full max-w-md bg-surface-container-lowest/90 backdrop-blur-lg rounded-[1.5rem] shadow-[0_8px_32px_rgba(0,0,0,0.08)] border border-white/50 p-stack-lg md:p-[32px] flex flex-col gap-stack-lg">
<!-- Header -->
<header class="text-center flex flex-col items-center gap-stack-md">
<div class="w-16 h-16 rounded-2xl bg-primary/10 flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-[40px] text-[#014BA0]" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background">¡Hola de nuevo!</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Ingresa tus datos para continuar protegido</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-stack-md">
<!-- Email/Phone Input -->
<div class="flex flex-col gap-stack-sm">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-b-2 border-outline-variant/50 focus:border-primary focus:bg-surface-container-lowest transition-colors rounded-t-lg outline-none font-body-md text-body-md text-on-background placeholder:text-outline/70" placeholder="Correo o Teléfono" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-stack-sm">
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-12 py-3 bg-surface-container-low border-b-2 border-outline-variant/50 focus:border-primary focus:bg-surface-container-lowest transition-colors rounded-t-lg outline-none font-body-md text-body-md text-on-background placeholder:text-outline/70" placeholder="Contraseña" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end mt-1">
<a class="font-label-caps text-label-caps text-primary hover:text-primary-container transition-colors" href="#">¿Olvidaste tu contraseña?</a>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#014BA0] hover:bg-[#013b80] text-on-primary py-4 rounded-xl font-headline-md text-[18px] font-bold shadow-md hover:shadow-lg active:scale-[0.98] transition-all mt-4" type="submit">
                Iniciar Sesión
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 my-2">
<div class="h-px bg-outline-variant/50 flex-1"></div>
<span class="font-label-caps text-label-caps text-outline">o entra con</span>
<div class="h-px bg-outline-variant/50 flex-1"></div>
</div>
<!-- Secondary Logins -->
<div class="flex gap-stack-md">
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-container border border-outline-variant/30 py-3 rounded-xl hover:bg-surface-container-high transition-colors text-on-surface-variant font-body-md font-semibold">
<!-- Fallback Google Icon using Material Symbols if actual svg isn't preferred -->
<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Google
            </button>
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-container border border-outline-variant/30 py-3 rounded-xl hover:bg-surface-container-high transition-colors text-on-surface-variant font-body-md font-semibold">
<span class="material-symbols-outlined text-[#014BA0]">fingerprint</span>
                Huella Digital
            </button>
</div>
<!-- Footer Link -->
<footer class="text-center mt-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                ¿No tienes una cuenta aún? 
                <a class="text-[#014BA0] font-semibold hover:underline decoration-2 underline-offset-4" href="#">Regístrate aquí</a>
</p>
</footer>
</main>
