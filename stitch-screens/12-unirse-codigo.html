<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.code-input');
            const joinBtn = document.getElementById('join-btn');

            const checkInputs = () => {
                const allFilled = Array.from(inputs).every(input => input.value.length === 1);
                if (allFilled) {
                    joinBtn.disabled = false;
                    joinBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    joinBtn.classList.add('hover:opacity-90', 'active:scale-95');
                } else {
                    joinBtn.disabled = true;
                    joinBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    joinBtn.classList.remove('hover:opacity-90', 'active:scale-95');
                }
            };

            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    // Allow only alphanumeric
                    input.value = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                    
                    if (input.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                    checkInputs();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && input.value.length === 0 && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
            
            // Focus first input on load
            if(inputs.length > 0) inputs[0].focus();
        });
    </script>
